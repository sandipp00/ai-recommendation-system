services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      RECOMMENDATION_DATASET: /app/data/raw/sample_movies.csv
      SEMANTIC_MODEL: all-MiniLM-L6-v2
      LLM_MODEL: EleutherAI/gpt-neo-125M
      HF_HOME: /models/huggingface
    volumes:
      - hf_cache:/models/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  hf_cache:
